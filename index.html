<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dreamfeed</title>
<style>
  :root{--bg:#141b2e;--ink:#e8e6f0;--muted:#8a93ad;--peach:#f5b48a;--panel:#1c2440;--border:#34405f;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);display:grid;place-items:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:24px;}
  .card{max-width:400px;text-align:center;}
  svg{width:64px;height:64px;}
  h1{font-size:26px;margin:14px 0 2px;letter-spacing:-.01em;}
  .tag{color:var(--muted);font-size:14px;margin-bottom:26px;}
  a{display:block;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:15px;color:var(--peach);text-decoration:none;font-weight:600;margin-top:10px;}
  a:hover{border-color:var(--peach);}
</style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.4 6.4 0 0 0 10.5 10.5Z" fill="var(--peach)"/><circle cx="15.5" cy="7.5" r="1.2" fill="var(--peach)" opacity=".6"/></svg>
    <h1>Dreamfeed</h1>
    <div class="tag">Baby Tracker: Feed &amp; Sleep</div>
    <a href="support.html">Support</a>
    <a href="privacy.html">Privacy Policy</a>
  </div>
</body>
</html>
